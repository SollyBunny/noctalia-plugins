id = "aurelia/bash_launcher"
name = "Bash Launcher"
version = "1.0.0"
plugin_api = 3
author = "Aurelia"
license = "MIT"
dependencies = []
tags = ["launcher"]
icon = "brand-tabler"
description = "Run bash commands from the launcher"

[[launcher_provider]]
id = "bash_launcher"
entry = "bash_launcher.luau"
prefix = "$"
glyph = "brand-tabler"
include_in_global_search = false

	[[launcher_provider.setting]]
	key = "terminal_command"
	type = "string"
	label_key = "settings.terminal_command.label"
	description_key = "settings.terminal_command.description"
	default = "setsid kitty --hold -- bash \"$SCRIPT\""
